apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-myapp-deploy  
  labels:
    app: java-myapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: java-myapp
  template:
    metadata:
      labels:
        app: java-myapp
    spec:
      containers:
      - name: webapp-java
        image: ananthsai12/java-myapp
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: java-webapp-service
  labels:
    app: java-webapp
spec:
  selector:
    app: java-myapp

  type: NodePort
  ports:
  - nodePort: 31028
    port: 8080
    targetPort: 8080
